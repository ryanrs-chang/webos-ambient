<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weather v4 Linework</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#8a93a0;
  font-family:"LG Smart UI","Noto Sans TC","PingFang TC",-apple-system,"Helvetica Neue",sans-serif}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:#000}
#clock{position:absolute;font-weight:200;letter-spacing:.02em;line-height:1;color:#8a93a0;font-variant-numeric:tabular-nums;white-space:nowrap}
#date{position:absolute;font-weight:300;font-size:40px;letter-spacing:.08em;color:#5d6572;white-space:nowrap}
#ui{position:absolute;left:0;right:0;bottom:22px;display:flex;justify-content:center;gap:10px;z-index:50;transition:opacity .4s}
#ui button{font:inherit;font-size:24px;color:#6b7482;background:rgba(255,255,255,.03);border:1px solid #232830;
  border-radius:10px;padding:8px 22px;cursor:pointer}
#ui button.on{color:#c3cad6;border-color:#4a5463;background:rgba(255,255,255,.09)}
#ui button:focus-visible{outline:2px solid #6f8fbf}
#fps{position:absolute;left:16px;top:12px;font:20px/1 ui-monospace,Menlo,monospace;color:#4d5562;z-index:50;transition:opacity .4s}
#hint{position:absolute;right:16px;top:12px;font-size:18px;color:#3b424d;z-index:50}
body.ui-off #ui,body.ui-off #fps,body.ui-off #hint{opacity:0}

#fx{position:absolute;left:0;top:0;width:1920px;height:1080px}
#clock{left:0;width:1920px;top:470px;text-align:center;font-size:240px;font-weight:200}
#date{left:0;width:1920px;top:730px;text-align:center}
</style>
</head>
<body>
<div id="stage">
  <canvas id="fx" width="1920" height="1080"></canvas>

  <div id="clock"></div><div id="date"></div>
  <div id="fps">-- fps</div><div id="hint">1-8 / ← → switch · H hide UI</div>
  <div id="ui"></div>
</div>

<script>
/* Shared shell: scaling, clock, kind switcher, FPS meter. Inlined into every prototype. */
const KINDS=[
  {id:'clear-day',zh:'晴(日)'},{id:'clear-night',zh:'晴(夜)'},{id:'partly',zh:'多雲'},{id:'overcast',zh:'陰'},
  {id:'rain',zh:'雨'},{id:'storm',zh:'雷雨'},{id:'snow',zh:'雪'},{id:'fog',zh:'霧'}];
const Shell=(()=>{
  const $=s=>document.querySelector(s);
  const stage=$('#stage');
  function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);
    stage.style.transform='translate('+(innerWidth-1920*s)/2+'px,'+(innerHeight-1080*s)/2+'px) scale('+s+')';}
  addEventListener('resize',fit);fit();
  // clock: HH:MM only (no seconds, OLED rule)
  const clk=$('#clock'),dateEl=$('#date');
  function tick(){const d=new Date();
    const t=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    if(clk.textContent!==t)clk.textContent=t;
    if(dateEl){const s=d.toLocaleDateString('zh-TW',{month:'long',day:'numeric',weekday:'long'});
      if(dateEl.textContent!==s)dateEl.textContent=s;}}
  tick();setInterval(tick,1000);
  // switcher
  let cur=null,hook=()=>{};
  const ui=$('#ui');
  KINDS.forEach((k,i)=>{const b=document.createElement('button');b.textContent=(i+1)+' '+k.zh;b.dataset.k=k.id;
    b.onclick=()=>set(k.id);ui.appendChild(b);});
  function set(id){
    if(!KINDS.some(k=>k.id===id))id='rain';
    cur=id;ui.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.k===id));
    try{history.replaceState(null,'','#'+id)}catch(e){}
    document.documentElement.dataset.kind=id;hook(id);}
  addEventListener('keydown',e=>{
    const i=KINDS.findIndex(k=>k.id===cur);
    if(e.key>='1'&&e.key<='8')set(KINDS[+e.key-1].id);
    else if(e.key==='ArrowRight')set(KINDS[(i+1)%8].id);
    else if(e.key==='ArrowLeft')set(KINDS[(i+7)%8].id);
    else if(e.key==='h'||e.key==='H')document.body.classList.toggle('ui-off');});
  // fps meter: counts frames that were actually drawn, and JS time spent per frame
  const fpsEl=$('#fps');const m={n:0,ms:0,t0:performance.now()};
  window.__stats={fps:0,ms:0,kind:null};
  function meter(now,cost){m.n++;m.ms+=cost;
    if(now-m.t0>=1000){const fps=m.n*1000/(now-m.t0),ms=m.ms/m.n;
      fpsEl.textContent=fps.toFixed(0)+' fps · '+ms.toFixed(1)+' ms';
      window.__stats={fps,ms,kind:cur};m.n=0;m.ms=0;m.t0=now;}}
  /** Frame loop capped at `fps` (default 30). draw(dt seconds, t seconds). */
  function loop(draw,fps){
    const iv=1000/(fps||30);let last=performance.now();
    function f(now){requestAnimationFrame(f);
      if(now-last<iv-3)return;
      const dt=Math.min((now-last)/1000,.1);last=now;
      const a=performance.now();draw(dt,now/1000);
      meter(now,performance.now()-a);}
    requestAnimationFrame(f);}
  function init(onKind){
    hook=onKind;
    const q=new URLSearchParams(location.search).get('k')||location.hash.slice(1);
    set(q||'rain');
    if(new URLSearchParams(location.search).has('clean'))document.body.classList.add('ui-off');}
  return{init,loop,set,kind:()=>cur};
})();

/* v4 Linework: thin-stroke line-art weather under a "sky arc" on which the sun/moon sits at the real time of day.
   Strokes are 1-2 px, so the lit pixel count is tiny (good for OLED); the sun/moon creeps along the arc all day.
   ?h=14 overrides the hour for demos. */
(()=>{
const W=1920,H=1080,TAU=Math.PI*2,cv=document.getElementById('fx'),ctx=cv.getContext('2d');
const R=Math.random,rr=(a,b)=>a+R()*(b-a);
const hourOverride=new URLSearchParams(location.search).get('h');
const CX=960,CY=960,AX=840,AY=800; // sky arc ellipse
let kind='',fade=0,T=0,clouds=[],drops=[],flakes=[],stars=[],ripples=[],shoot=null,nextShoot=0,flash=null,nextBolt=0,bolt=null,fogLines=[];

const SKY={'clear-day':{body:'sun',clouds:[[2,.45,.8]]},'clear-night':{body:'moon',stars:48,clouds:[[1,.5,.7]]},
  'partly':{body:'sun',clouds:[[3,.55,.9],[2,1,1.2]]},'overcast':{body:'cloud',clouds:[[4,.6,.9],[4,1,1.2],[3,1.5,1.4]]},
  'rain':{body:'cloud',rain:90,clouds:[[3,.7,.9],[3,1.3,1.3]]},'storm':{body:'cloud',rain:130,storm:true,clouds:[[3,.8,.9],[4,1.5,1.4]]},
  'snow':{body:'cloud',snow:70,clouds:[[3,.7,.9],[2,1.3,1.1]]},'fog':{body:'cloud',fog:true,clouds:[[2,.5,.6]]}};
const CIRC=[[0,-24,24],[42,-48,36],[92,-60,44],[140,-40,32],[172,-22,22]]; // union of circles + flat base = cloud outline
function drawCloud(x,y,s,a,col){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.strokeStyle=col||'rgb(180,195,220)';ctx.globalAlpha=a;ctx.lineWidth=3.2/s;ctx.lineJoin='round';
  ctx.beginPath();CIRC.forEach(c=>{ctx.moveTo(c[0]+c[2],c[1]);ctx.arc(c[0],c[1],c[2],0,TAU);});ctx.moveTo(0,0);ctx.lineTo(172,0);ctx.stroke();
  ctx.globalAlpha=1;ctx.fillStyle='#000';ctx.beginPath();CIRC.forEach(c=>{ctx.moveTo(c[0]+c[2],c[1]);ctx.arc(c[0],c[1],c[2],0,TAU);});ctx.rect(0,-24,172,24);ctx.fill();
  ctx.restore();}
function setKind(k){
  kind=k;fade=0;const c=SKY[k];
  clouds=[];c.clouds.forEach(([n,sc,al])=>{for(let i=0;i<n;i++){const s=sc*rr(.85,1.15);
    clouds.push({x:rr(-300,W),y:rr(150,600)*(sc>1.2?.85:1)+(sc<.6?-40:0),s,a:.3*al*(sc<.7?.8:1),v:rr(6,12)*(.5+sc),bob:rr(3,8),ph:R()*TAU});}});
  clouds.sort((a,b)=>a.s-b.s);
  drops=Array.from({length:c.rain||0},()=>newDrop(true));
  flakes=Array.from({length:c.snow||0},()=>({x:rr(-50,W),y:rr(0,H),r:rr(4,11),s:rr(40,110),ph:R()*TAU,rot:R()*TAU,ring:R()<.25}));
  stars=Array.from({length:c.stars||0},()=>({x:rr(60,W-60),y:rr(40,620),r:rr(3,7),f:rr(.5,2),ph:R()*TAU}));
  fogLines=c.fog?Array.from({length:7},(_,i)=>({y:260+i*95,amp:rr(8,22),k:rr(.004,.008),sp:rr(.12,.3)*(i%2?1:-1),ph:R()*TAU,a:.14+.06*(i%3)/2})):[];
  ripples=[];flash=null;bolt=null;shoot=null;nextShoot=T+rr(2,5);nextBolt=T+rr(3,6);}
function newDrop(init){return{x:rr(-200,W),y:init?rr(0,1000):-30,len:rr(18,34),s:rr(700,1000),gy:rr(960,1050)};}
function bodyPos(){const d=new Date(),h=hourOverride!==null?+hourOverride:d.getHours()+d.getMinutes()/60;
  const p=((((h-6)%12)+12)%12)/12;const a=Math.PI*(1-p);return[CX+AX*Math.cos(a),CY-AY*Math.sin(a)];}
function drawSun(x,y,a){
  ctx.strokeStyle='rgb(255,200,120)';ctx.lineWidth=2.5;ctx.globalAlpha=a*.6;ctx.beginPath();ctx.arc(x,y,36,0,TAU);ctx.stroke();
  const rot=T*.08;ctx.globalAlpha=a*.5;ctx.lineWidth=2;ctx.lineCap='round';ctx.beginPath();
  for(let i=0;i<12;i++){const t=rot+i/12*TAU,r0=50+4*Math.sin(T*.8+i),r1=r0+(i%2?12:22);ctx.moveTo(x+Math.cos(t)*r0,y+Math.sin(t)*r0);ctx.lineTo(x+Math.cos(t)*r1,y+Math.sin(t)*r1);}
  ctx.stroke();}
function drawMoon(x,y,a){ctx.strokeStyle='rgb(210,222,245)';ctx.lineWidth=2.5;ctx.globalAlpha=a*.6;
  ctx.save();ctx.translate(x,y);ctx.beginPath();ctx.rect(-90,-90,180,180);ctx.arc(15,-9,31,0,TAU);ctx.clip('evenodd');ctx.beginPath();ctx.arc(0,0,34,0,TAU);ctx.stroke();ctx.restore();
  ctx.save();ctx.translate(x,y);ctx.beginPath();ctx.arc(0,0,34,0,TAU);ctx.clip();ctx.beginPath();ctx.arc(15,-9,31,0,TAU);ctx.stroke();ctx.restore();}

function frame(dt,tAbs){
  T=tAbs;fade=Math.min(1,fade+dt/1.4);const c=SKY[kind];
  ctx.globalAlpha=1;ctx.clearRect(0,0,W,H);ctx.lineCap='round';
  const boost=flash?1+flash.a*7:1;
  // sky arc: dashed, with an hour tick every 1/12 of the way
  ctx.strokeStyle='rgb(150,168,200)';ctx.globalAlpha=.16*fade;ctx.lineWidth=1.5;ctx.setLineDash([3,12]);
  ctx.beginPath();ctx.ellipse(CX,CY,AX,AY,0,Math.PI,TAU);ctx.stroke();ctx.setLineDash([]);
  ctx.globalAlpha=.3*fade;ctx.lineWidth=2;ctx.beginPath();
  for(let i=0;i<=12;i++){const a=Math.PI*(1-i/12),ex=CX+AX*Math.cos(a),ey=CY-AY*Math.sin(a);
    ctx.moveTo(ex,ey);ctx.lineTo(ex+Math.cos(a)*-14*.6,ey+Math.sin(a)*14*.6);}
  ctx.stroke();
  const [bx,by]=bodyPos();
  if(c.body==='sun')drawSun(bx,by,fade);else if(c.body==='moon')drawMoon(bx,by,fade);
  else drawCloud(bx-70,by+22,.8,.3*fade*boost);
  if(stars.length){ctx.strokeStyle='rgb(225,235,255)';ctx.lineWidth=1.3;
    stars.forEach(s=>{ctx.globalAlpha=(.15+.5*(.5+.5*Math.sin(T*s.f+s.ph)))*fade;ctx.beginPath();
      ctx.moveTo(s.x-s.r,s.y);ctx.lineTo(s.x+s.r,s.y);ctx.moveTo(s.x,s.y-s.r);ctx.lineTo(s.x,s.y+s.r);ctx.stroke();});
    if(!shoot&&T>nextShoot){shoot={x:rr(W*.5,W-100),y:rr(40,300),t:0,dur:.9,a:rr(.45,.65),len:rr(200,300)};}
    if(shoot){shoot.t+=dt;const p=shoot.t/shoot.dur;if(p>=1){shoot=null;nextShoot=T+rr(6,13);}
      else{const hx=shoot.x-Math.cos(shoot.a)*1100*p,hy=shoot.y+Math.sin(shoot.a)*1100*p,tx=hx+Math.cos(shoot.a)*shoot.len,ty=hy-Math.sin(shoot.a)*shoot.len;
        const g=ctx.createLinearGradient(tx,ty,hx,hy);g.addColorStop(0,'rgba(225,235,255,0)');g.addColorStop(1,'rgba(235,242,255,'+(Math.sin(Math.PI*p)*.5*fade)+')');
        ctx.globalAlpha=1;ctx.strokeStyle=g;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(hx,hy);ctx.stroke();}}}
  // clouds (outlines, black fill occludes whatever is behind)
  clouds.forEach(k=>{k.x+=k.v*dt;if(k.x>W+40)k.x=-200*k.s;drawCloud(k.x,k.y+Math.sin(T*.35+k.ph)*k.bob,k.s,Math.min(.45,k.a*fade*boost));});
  // fog: stacked wavy lines
  fogLines.forEach(f=>{ctx.strokeStyle='rgb(200,212,230)';ctx.globalAlpha=f.a*fade;ctx.lineWidth=1.6;ctx.beginPath();
    for(let x=-20;x<=W+20;x+=24){const y=f.y+Math.sin(x*f.k*TAU/2+T*f.sp+f.ph)*f.amp+Math.sin(x*.002+T*.05)*10;x<0?ctx.moveTo(x,y):ctx.lineTo(x,y);}ctx.stroke();});
  if(drops.length){
    const wind=c.storm?260+120*Math.sin(T*.4):110;ctx.strokeStyle='rgb(175,205,255)';ctx.lineWidth=1.6;ctx.globalAlpha=.38*fade;ctx.beginPath();
    drops.forEach((d,i)=>{d.y+=d.s*dt;d.x+=wind*dt*d.s/900;
      if(d.y>=d.gy){if(ripples.length<30&&R()<.4&&d.x>0&&d.x<W)ripples.push({x:d.x,y:d.gy,t:0});drops[i]=newDrop(false);return;}
      const n=Math.hypot(wind,d.s);ctx.moveTo(d.x,d.y);ctx.lineTo(d.x-wind/n*d.len,d.y-d.s/n*d.len);});
    ctx.stroke();
    ctx.lineWidth=1.3;for(let i=ripples.length-1;i>=0;i--){const r=ripples[i];r.t+=dt;const p=r.t/.9;if(p>=1){ripples.splice(i,1);continue;}
      ctx.globalAlpha=(1-p)*.3*fade;ctx.beginPath();ctx.ellipse(r.x,r.y,4+26*p,1.5+8*p,0,0,TAU);ctx.stroke();}
    ctx.globalAlpha=.1*fade;ctx.lineWidth=1;ctx.setLineDash([2,10]);ctx.beginPath();ctx.moveTo(0,1015);ctx.lineTo(W,1015);ctx.stroke();ctx.setLineDash([]);}
  if(flakes.length){ctx.strokeStyle='rgb(225,235,255)';ctx.lineWidth=1.2;ctx.globalAlpha=.45*fade;ctx.beginPath();
    flakes.forEach(f=>{f.y+=f.s*dt;f.x+=(30+Math.sin(T*.7+f.ph)*28)*dt;f.rot+=dt*.4;if(f.y>H+20){f.y=-20;f.x=rr(-50,W);}if(f.x>W+30)f.x=-30;
      if(f.ring){ctx.moveTo(f.x+f.r*.6,f.y);ctx.arc(f.x,f.y,f.r*.6,0,TAU);}
      else for(let i=0;i<3;i++){const a=f.rot+i*Math.PI/3,dx=Math.cos(a)*f.r,dy=Math.sin(a)*f.r;ctx.moveTo(f.x-dx,f.y-dy);ctx.lineTo(f.x+dx,f.y+dy);}});
    ctx.stroke();}
  if(c.storm){
    if(!flash&&T>nextBolt){flash={t:0,a:0};const x0=rr(400,W-400);bolt=[[x0,420]];let x=x0,y=420;while(y<900){x+=rr(-40,40);y+=rr(30,60);bolt.push([x,y]);}}
    if(flash){flash.t+=dt;const t=flash.t;flash.a=t<.06?.10*t/.06:t<.14?.10-.06*(t-.06)/.08:t<.22?.04+.06*(t-.14)/.08:t<.6?.10*Math.max(0,1-(t-.22)/.38):0;
      if(t>=.6){flash=null;bolt=null;nextBolt=T+rr(7,16);}
      else if(t<.35){const k=Math.max(0,1-(t-.08)/.27);ctx.strokeStyle='rgb(235,240,255)';ctx.lineJoin='miter';ctx.lineWidth=2.4;ctx.globalAlpha=.55*k*fade;
        ctx.beginPath();bolt.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();}}}
  ctx.globalAlpha=1;
}
Shell.init(k=>setKind(k));
Shell.loop(frame,30);
})();
</script>
</body>
</html>
